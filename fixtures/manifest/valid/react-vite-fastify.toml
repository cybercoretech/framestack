# expect: valid
# ADR-0007 TypeScript reference: React + Vite frontend, separate Fastify API.
manifest_version = 1

[project]
name = "typescript-reference"

[[components]]
id = "web"
kind = "application"
path = "apps/web"
language = "typescript"
integrations = ["react", "vite"]
provides = ["frontend.browser", "frontend.spa"]
requires = ["api.rest"]

[[components]]
id = "api"
kind = "service"
path = "services/api"
language = "typescript"
runtime = "node"
integrations = ["fastify"]
provides = ["http.server", "http.api", "api.rest"]
env = ["PORT", "DATABASE_URL"]

[[relationships]]
from = "web"
to = "api"
type = "communicates_with"
protocol = "http"
