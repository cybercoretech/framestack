name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify local handoff is ignored
        shell: bash
        run: |
          set -euo pipefail
          git check-ignore -q AGENT_HANDOFF.md
          if git ls-files --error-unmatch AGENT_HANDOFF.md >/dev/null 2>&1; then
            echo "AGENT_HANDOFF.md must never be tracked." >&2
            exit 1
          fi

      - name: Require lockfiles when manifests exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.toml && ! -f Cargo.lock ]]; then
            echo "Cargo.toml exists but Cargo.lock is missing." >&2
            exit 1
          fi
          if [[ -f package.json && ! -f package-lock.json && ! -f pnpm-lock.yaml ]]; then
            echo "package.json exists but package-lock.json or pnpm-lock.yaml is missing." >&2
            exit 1
          fi

      - name: Check patch whitespace
        run: git diff --check

  documentation:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Validate documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-retries 2 "./**/*.md" "./**/*.mdx"

  # hashFiles() is not available in job-level `if`, so detect manifests here.
  detect:
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.manifests.outputs.rust }}
      typescript: ${{ steps.manifests.outputs.typescript }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find workspace manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.toml ]]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -f package.json ]]; then echo "typescript=true" >> "$GITHUB_OUTPUT"; else echo "typescript=false" >> "$GITHUB_OUTPUT"; fi

  rust:
    name: Rust stable gate
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  rust-msrv:
    name: Rust 1.85 (minimum supported)
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Keep in step with rust-version in Cargo.toml.
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

  # Proves the Leptos + Axum adapter end to end (roadmap Stage 2): FrameStack
  # plans and builds the reference application, then the server is checked.
  reference-leptos-axum:
    name: Rust reference stack (Leptos + Axum)
    needs: detect
    if: ${{ needs.detect.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Leptos 0.8 needs Rust 1.88, so this job uses stable, not the 1.85 MSRV.
      - name: Install stable Rust with the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/rust-leptos-axum -> target

      - name: Cache cargo-leptos
        id: cargo-leptos-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-leptos
          key: cargo-leptos-0.3.12-${{ runner.os }}

      - name: Install cargo-leptos
        if: steps.cargo-leptos-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-leptos --locked --version 0.3.12

      - name: Build framestack
        run: cargo build --locked -p framestack-cli

      - name: Check, plan and build the example through FrameStack
        run: |
          target/debug/framestack check --manifest examples/rust-leptos-axum
          target/debug/framestack plan build --manifest examples/rust-leptos-axum
          target/debug/framestack build --yes --manifest examples/rust-leptos-axum

      - name: Smoke test the built server
        run: scripts/smoke-leptos-axum.sh

  typescript:
    name: TypeScript stable gate
    needs: detect
    if: ${{ needs.detect.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.22.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and validate pnpm workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm run --if-present check
          pnpm run --if-present test
