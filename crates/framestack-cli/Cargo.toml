[package]
name = "framestack-cli"
description = "The framestack command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
framestack-core.workspace = true
framestack-leptos-axum.workspace = true
clap = { version = "4.6.10", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.105"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "framestack"
path = "src/main.rs"
